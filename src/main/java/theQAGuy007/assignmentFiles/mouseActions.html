<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Mouse Actions Playground</title>
    <style>
        body { font-family: Arial, sans-serif; }
        .box {
          width: 150px;
          height: 150px;
          background: lightblue;
          margin: 20px;
          display: inline-block;
          text-align: center;
          line-height: 150px;
          cursor: pointer;
          border: 2px solid #333;
        }
        #dropZone {
          width: 200px;
          height: 200px;
          border: 2px dashed #666;
          margin: 20px;
          text-align: center;
          line-height: 200px;
        }
        .feedback {
          margin-top: 10px;
          padding: 8px;
          border: 1px solid #ccc;
          background: #f9f9f9;
          min-height: 25px;
          font-weight: bold;
        }
    </style>
</head>
<body>
<h2>Mouse Actions Practice</h2>

<div id="clickBox" class="box">Click Me</div>
<div id="clickFeedback" class="feedback">Waiting for click...</div>

<div id="dblClickBox" class="box">Double Click Me</div>
<div id="dblClickFeedback" class="feedback">Waiting for double click...</div>

<div id="rightClickBox" class="box">Right Click Me</div>
<div id="rightClickFeedback" class="feedback">Waiting for right click...</div>

<div id="hoverBox" class="box">Hover Over Me</div>
<div id="hoverFeedback" class="feedback">Waiting for hover...</div>

<div id="dragBox" class="box" draggable="true">Drag Me</div>
<div id="dropZone">Drop Here</div>
<div id="dragFeedback" class="feedback">Waiting for drag/drop...</div>

<div id="holdBox" class="box">Click & Hold Me</div>
<div id="holdFeedback" class="feedback">Waiting for hold...</div>

<script>
    // Click
    document.getElementById('clickBox').addEventListener('click', function() {
      document.getElementById('clickFeedback').innerText = '✅ Click detected!';
    });

    // Double Click
    document.getElementById('dblClickBox').addEventListener('dblclick', function() {
      document.getElementById('dblClickFeedback').innerText = '🔄 Double Click detected!';
    });

    // Right Click
    document.getElementById('rightClickBox').addEventListener('contextmenu', function(e) {
      e.preventDefault();
      document.getElementById('rightClickFeedback').innerText = '➡️ Right Click detected!';
    });

    // Hover
    document.getElementById('hoverBox').addEventListener('mouseover', function() {
      document.getElementById('hoverFeedback').innerText = '🟠 Mouse entered!';
    });
    document.getElementById('hoverBox').addEventListener('mouseout', function() {
      document.getElementById('hoverFeedback').innerText = '🟣 Mouse left!';
    });

    // Drag and Drop
    const dragBox = document.getElementById('dragBox');
    const dropZone = document.getElementById('dropZone');

    dragBox.addEventListener('dragstart', function(e) {
      e.dataTransfer.setData('text/plain', 'dragBox');
      document.getElementById('dragFeedback').innerText = '🚚 Drag started!';
    });

    dropZone.addEventListener('dragover', function(e) {
      e.preventDefault(); // Required
      dropZone.style.background = '#ddd';
    });

    dropZone.addEventListener('dragleave', function() {
      dropZone.style.background = '';
    });

    dropZone.addEventListener('drop', function(e) {
      e.preventDefault();
      const data = e.dataTransfer.getData('text/plain');
      if (data === 'dragBox') {
        document.getElementById('dragFeedback').innerText = '📦 Dropped successfully!';
        dropZone.style.background = '';
      }
    });

    // Click and Hold Counter
    const holdBox = document.getElementById('holdBox');
    let holdInterval;
    let holdSeconds = 0;

    holdBox.addEventListener('mousedown', function() {
      holdSeconds = 0;
      document.getElementById('holdFeedback').innerText = '⏱ Hold started...';
      holdInterval = setInterval(function() {
        holdSeconds++;
        document.getElementById('holdFeedback').innerText = '⏱ Holding for ' + holdSeconds + ' second(s)';
      }, 1000);
    });

    holdBox.addEventListener('mouseup', function() {
      clearInterval(holdInterval);
      document.getElementById('holdFeedback').innerText = '✅ Hold released after ' + holdSeconds + ' second(s)';
    });

    holdBox.addEventListener('mouseleave', function() {
      clearInterval(holdInterval);
      if (holdSeconds > 0) {
        document.getElementById('holdFeedback').innerText = '⚠️ Hold interrupted after ' + holdSeconds + ' second(s)';
      }
    });
</script>
</body>
</html>
